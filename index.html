<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>M3U 合并 + 分类 + 自定义排序工具</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h2 { margin-top: 30px; }
    textarea { width: 100%; height: 300px; white-space: pre; font-family: monospace; }
    button { padding: 10px 20px; margin-top: 10px; margin-right: 10px; }

    ul { list-style: none; padding-left: 0; }
    li { background: #f0f0f0; padding: 6px 12px; margin: 5px 0; cursor: move; border: 1px solid #ccc; }

    .sortable-section { display: flex; gap: 30px; }
    .sortable-box { width: 300px; }
  </style>
</head>
<body>
  <h1>M3U 合并 + 分类 + 自定义排序工具</h1>

  <h2>1. 上传多个播放列表（不限扩展名）</h2>
  <input type="file" id="m3uFiles" multiple /><br />
  <div class="sortable-box">
    <p>👉 拖拽排序文件合并顺序：</p>
    <ul id="fileList"></ul>
  </div>

  <h2>2. 上传频道排序模板（标准 M3U 格式）</h2>
  <input type="file" id="templateFile" /><br />

  <h2>3. 手动排序频道分组顺序（可拖拽覆盖默认排序）</h2>
  <div class="sortable-box">
    <ul id="groupList"></ul>
  </div>

  <button onclick="previewFiles()">预览处理内容</button>
  <button onclick="downloadPreview()">下载处理文件</button>

  <h2>输出内容预览</h2>
  <textarea id="outputArea" readonly></textarea>

  <script>
    const fileInput = document.getElementById('m3uFiles');
    const fileListEl = document.getElementById('fileList');
    const groupListEl = document.getElementById('groupList');
    const outputArea = document.getElementById('outputArea');

    let fileMap = [];
    let detectedGroups = new Set();
    let lastOutput = '';

    // 默认分组顺序
    const defaultGroupOrder = ["央视","卫视","地方","其他","香港","台湾","NBA","体育直播","体育频道","斯玛特","测试"];

    fileInput.addEventListener('change', () => {
      fileMap = Array.from(fileInput.files).map(f => ({ file: f, name: f.name }));
      renderFileList();
      readGroupsFromFiles(fileMap);
    });

    function renderFileList() {
      fileListEl.innerHTML = '';
      fileMap.forEach((f,i)=>{
        const li = document.createElement('li');
        li.textContent = f.name;
        li.draggable = true;
        li.dataset.index = i;
        fileListEl.appendChild(li);
      });
    }

    function renderGroupList(groups) {
      groupListEl.innerHTML = '';
      groups.forEach((g,i)=>{
        const li = document.createElement('li');
        li.textContent = g;
        li.draggable = true;
        li.dataset.index = i;
        groupListEl.appendChild(li);
      });
    }

    function readGroupsFromFiles(fileArr){
      detectedGroups = new Set();
      const promises = fileArr.map(({file})=>file.text().then(text=>{
        const lines = text.split('\n');
        lines.forEach(line=>{
          if(line.startsWith('#EXTINF')){
            const match = line.match(/group-title="([^"]+)"/);
            if(match) detectedGroups.add(match[1]);
          }
        });
      }));

      Promise.all(promises).then(()=>{
        // 使用默认顺序合并未识别的组
        const allGroups = [...defaultGroupOrder];
        detectedGroups.forEach(g=>{
          if(!allGroups.includes(g)) allGroups.push(g);
        });
        renderGroupList(allGroups);
      });
    }

    function fixTvgId(infoLine){
      const hasTvgId = /tvg-id="[^"]*"/.test(infoLine);
      const tvgNameMatch = infoLine.match(/tvg-name="([^"]*)"/);
      if(!hasTvgId && tvgNameMatch){
        const tvgName = tvgNameMatch[1];
        const insertPos = infoLine.indexOf('tvg-name="');
        const insertStr = `tvg-id="${tvgName}" `;
        return infoLine.slice(0,insertPos)+insertStr+infoLine.slice(insertPos);
      }
      return infoLine;
    }

    function parseM3U(content){
      const lines = content.split('\n');
      const entries = [];
      for(let i=0;i<lines.length-1;i++){
        const line = lines[i].trim();
        if(line.startsWith('#EXTINF')){
          const infoLine = line;
          const urlLine = lines[i+1].trim();
          const groupMatch = infoLine.match(/group-title="([^"]+)"/);
          const nameMatch = infoLine.match(/,(.+)$/);
          const group = groupMatch ? groupMatch[1] : '未分类';
          const name = nameMatch ? nameMatch[1].trim() : '未知频道';
          const fixedInfoLine = fixTvgId(infoLine);
          entries.push({group,name,info:fixedInfoLine,url:urlLine,originalIndex:i});
        }
      }
      return entries;
    }

    async function previewFiles(){
      lastOutput = await processFiles(false);
      outputArea.value = lastOutput;
    }

    async function downloadPreview(){
      if(!lastOutput){
        alert('请先点击“预览处理内容”生成文件。');
        return;
      }
      downloadFile('merged_sorted.m3u',lastOutput);
    }

    async function processFiles(forDownload=true){
      const fileOrder = Array.from(fileListEl.children).map(li=>fileMap[parseInt(li.dataset.index)].file);
      const groupOrder = Array.from(groupListEl.children).map(li=>li.textContent);

      // 模板解析
      let templateOrder = [];
      let templateMap = {};
      const templateInput = document.getElementById('templateFile');
      if(templateInput.files.length>0){
        const text = await templateInput.files[0].text();
        const templateEntries = parseM3U(text);
        templateOrder = templateEntries.map(e=>e.name);
        templateEntries.forEach(e=>{
          templateMap[e.name] = e.info; // 保存 #EXTINF 行
        });
      }

      // 合并文件
      let allEntries = [];
      for(const file of fileOrder){
        const text = await file.text();
        const entries = parseM3U(text);
        allEntries = allEntries.concat(entries);
      }

      // 按分组分类
      const grouped = {};
      allEntries.forEach(e=>{
        if(!grouped[e.group]) grouped[e.group]=[];
        grouped[e.group].push(e);
      });

      let output = '#EXTM3U x-tvg-url="https://epg.443442.xyz/t.xml.gz"\n\n';
      for(const group of groupOrder){
        if(!grouped[group]) continue;
        const entries = grouped[group];

        // 模板排序已匹配的
        const matched = [];
        const unmatched = [];
        entries.forEach(e=>{
          if(templateOrder.includes(e.name)) matched.push(e);
          else unmatched.push(e);
        });

        matched.sort((a,b)=>{
          const aIndex = templateOrder.indexOf(a.name);
          const bIndex = templateOrder.indexOf(b.name);
          return aIndex - bIndex;
        });

        const finalEntries = [...matched,...unmatched];

        finalEntries.forEach(e=>{
          const infoLine = templateMap[e.name] || e.info; // 仅替换 #EXTINF
          output += `${infoLine}\n${e.url}\n`;
        });
        output += '\n\n';
      }

      if(forDownload) lastOutput = output;
      return output;
    }

    function downloadFile(filename,content){
      const blob = new Blob([content],{type:'text/plain;charset=utf-8'});
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function enableDragSort(listElement){
      let draggingEl;
      listElement.addEventListener('dragstart',e=>draggingEl=e.target);
      listElement.addEventListener('dragover',e=>e.preventDefault());
      listElement.addEventListener('drop',e=>{
        e.preventDefault();
        if(!draggingEl || draggingEl===e.target || e.target.tagName!=='LI') return;
        const from = draggingEl.dataset.index;
        const to = e.target.dataset.index;

        if(listElement===fileListEl){
          const temp = fileMap[from];
          fileMap.splice(from,1);
          fileMap.splice(to,0,temp);
          renderFileList();
        }else if(listElement===groupListEl){
          const arr = Array.from(detectedGroups);
          const moved = arr.splice(from,1)[0];
          arr.splice(to,0,moved);
          detectedGroups = new Set(arr);
          renderGroupList(arr);
        }
      });
    }

    enableDragSort(fileListEl);
    enableDragSort(groupListEl);
  </script>
</body>
</html>
